[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sfdc-flow-forge"
version = "0.1.0"
description = "Describe business logic in plain language, get a Salesforce Flow that deploys."
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn",
    "httpx",
    "pydantic>=2",
    "google-genai",
    "anthropic",
    "ollama",
    "mcp",
]

# server.py, survey.py and mcp_server.py live at the repo root, not inside
# the flowtool package, so they need to be listed explicitly - setuptools
# only auto-discovers packages. survey.py is needed at runtime, not just from
# the CLI: server.py imports it for the "Generate support report" endpoint.
# mcp_server.py is a separate entry point (`python -m mcp_server`, or a
# client's MCP config pointing at it directly) - it imports server.py for
# its build_provider/_bundle_files_and_types/_failures helpers rather than
# re-implementing them, so both need to ship together.
[tool.setuptools]
py-modules = ["server", "survey", "mcp_server"]
include-package-data = true

[tool.setuptools.packages.find]
include = ["flowtool*"]

[tool.setuptools.package-data]
flowtool = ["static/*", "static/vendor/*", "static/install/*"]
