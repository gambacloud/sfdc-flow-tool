[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sfdc-flow-forge"
version = "0.1.0"
description = "Describe business logic in plain language, get a Salesforce Flow that deploys."
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn",
    "httpx",
    "pydantic>=2",
    "google-genai",
    "anthropic",
    "ollama",
]

# server.py and survey.py live at the repo root, not inside the flowtool
# package, so they need to be listed explicitly - setuptools only
# auto-discovers packages. survey.py is needed at runtime, not just from the
# CLI: server.py imports it for the "Generate support report" endpoint.
[tool.setuptools]
py-modules = ["server", "survey"]
include-package-data = true

[tool.setuptools.packages.find]
include = ["flowtool*"]

[tool.setuptools.package-data]
flowtool = ["static/*", "static/vendor/*"]
